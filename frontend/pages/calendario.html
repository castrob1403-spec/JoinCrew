<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calendario | JoinCrew</title>
    <link rel="stylesheet" href="../css/MemberPages.css" />
  </head>
  <body>
    <header class="header">
      <a class="brand" href="app.html"
        ><img src="../img/LOGOJC2.png" alt="JoinCrew"
      /></a>
      <nav>
        <a href="app.html">Explorar</a><a href="grupos.html">Grupos</a
        ><a href="chat.html">Chat</a
        ><a class="active" href="calendario.html">Calendario</a>
      </nav>
      <div class="header-right">
        <span data-user-name>Estudiante</span
        ><button id="logout-button" class="logout">Cerrar sesión</button>
      </div>
    </header>
    <main class="page">
      <p class="eyebrow">PLANIFICACIÓN</p>
      <h1 class="page-title">Tu calendario de estudio</h1>
      <p class="subtitle">
        Organiza sesiones para mantener el ritmo y estudiar acompañado.
      </p>
      <section class="card">
        <h2 id="calendar-form-title">Agenda una sesión</h2>
        <form id="session-form" class="calendar-form">
          <label
            >Materia<input
              id="session-subject"
              maxlength="100"
              required
              placeholder="Ej.: Cálculo"
          /></label>
          <label
            >Fecha y hora<input
              id="session-starts-at"
              type="datetime-local"
              required
          /></label>
          <label
            >Duración<select id="session-duration" required>
              <option value="30">30 minutos</option>
              <option value="60" selected>1 hora</option>
              <option value="90">1 hora y media</option>
              <option value="120">2 horas</option>
              <option value="180">3 horas</option>
            </select></label
          >
          <label class="calendar-notes"
            >Notas opcionales<textarea
              id="session-notes"
              maxlength="500"
              placeholder="Qué quieres repasar o preparar"
            ></textarea>
          </label>
          <div class="calendar-form-footer">
            <p id="calendar-message" class="message" aria-live="polite"></p>
            <div>
              <button
                id="cancel-session-edit"
                class="secondary hidden"
                type="button"
              >
                Cancelar
              </button>
              <button id="save-session-button" class="primary" type="submit">
                Guardar sesión
              </button>
            </div>
          </div>
        </form>
      </section>
      <section class="card calendar-week-card">
        <div class="calendar-heading">
          <h2>Esta semana</h2>
          <span id="calendar-week-label"></span>
        </div>
        <div id="calendar-grid" class="calendar-grid"></div>
      </section>
      <section class="card" style="margin-top: 18px">
        <h2>Próximas sesiones</h2>
        <p id="upcoming-session-status" class="message">
          Cargando tus sesiones…
        </p>
        <div id="upcoming-sessions" class="upcoming-sessions"></div>
      </section>
    </main>
    <script src="../js/api-client.js"></script>
    <script src="../js/member-page.js"></script>
    <script src="../js/calendar.js"></script>
  </body>
</html>
